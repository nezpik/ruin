name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]" ruff mypy types-PyYAML
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check
        run: python -m mypy ruin
      - name: Test
        run: python -m pytest -q
      - name: Validate against Cramér-Lundberg
        run: ruin validate
      - name: Stylized facts of the reference scenario
        run: ruin facts --config examples/urban_ruin_shift.yaml
