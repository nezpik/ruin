[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruin"
version = "0.3.0"
description = "Destiny-framed ruin risk for stochastic logistics flow."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Naji Zouiti" }]
dependencies = [
    "numpy>=2.1",
    "pydantic>=2.10",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
ai = [
    "openai-codex>=0.1.0b3",
]

[project.urls]
Repository = "https://github.com/nezpik/ruin"

[project.scripts]
ruin = "ruin.cli:main"

[tool.setuptools.packages.find]
include = ["ruin*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# [dependency-groups] moved into [project.optional-dependencies] dev

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=4.6.0",
]
