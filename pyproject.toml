[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruin"
version = "0.1.0"
description = "Destiny-framed ruin risk for stochastic logistics flow."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Naji Zouiti" }]
dependencies = []

[project.urls]
Repository = "https://github.com/nezpik/ruin"

[project.scripts]
ruin = "ruin.cli:main"

[tool.setuptools.packages.find]
include = ["ruin*"]
